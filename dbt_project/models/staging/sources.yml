version: 2

sources:
  - name: raw
    schema: main_raw
    description: "Raw scored payment events"
    tables:
      - name: payments
        identifier: sample_payments
        description: "Scored cross-border payment transactions"
        columns:
          - name: transaction_id
            tests:
              - unique
              - not_null
          - name: amount_zar
            tests:
              - not_null
          - name: risk_band
            tests:
              - not_null
          - name: bop_category_code
            tests:
              - not_null
